apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-portal-ingress
  namespace: university-apps
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "16m"
    
    # Конфигурация CORS политик
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.example.edu.kz"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    
    # Тонкий балансировщик: Использование Sticky Sessions (Cookie) для бесшовной работы сессий Yii2 фреймворка
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "k8s_route_cookie"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$connection"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - app.example.edu.kz
    secretName: wildcard-production-tls
  rules:
  - host: app.example.edu.kz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: student-portal-svc
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: student-portal-svc
  namespace: university-apps
spec:
  type: ClusterIP
  selector:
    app: student-portal
  ports:
    - port: 80
      targetPort: 80