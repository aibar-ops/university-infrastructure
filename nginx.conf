user www-data;
worker_processes auto;
pcre_jit on;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    
    # Тюнинг под высокие нагрузки: загрузка тяжелых сканов документов, фото и файлов абитуриентов
    client_max_body_size 100M;
    client_body_buffer_size 16M;    # Увеличенный буфер в RAM для быстрой обработки входящего тела запроса
    client_body_timeout 300s;       # Защита от обрыва соединений при медленной загрузке

    server {
        listen 80 default_server;
        server_name _;
        
        # Архитектурная особенность Yii2: точка входа находится строго в папке /web
        root /var/www/html/web; 
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Проксирование всех PHP запросов на локальный сокет/порт PHP-FPM
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300s;
            fastcgi_connect_timeout 300s;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Запрет доступа к скрытым системным файлам (.htaccess, .git, .env)
        location ~ /\.(ht|git|env) {
            deny all;
        }
    }
}