apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns-internal
  namespace: powerdns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdns-auth-internal
  template:
    metadata:
      labels:
        app: pdns-auth-internal
    spec:
      # hostNetwork включен для привязки к локальному сетевому интерфейсу внутренней DNS-ноды
      hostNetwork: true
      nodeSelector:
        dns-type: "internal"
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "powerdns"
        effect: "NoSchedule"
      containers:
      - name: pdns
        image: powerdns/pdns-auth-48:latest
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: config-volume
          mountPath: /etc/powerdns/pdns.conf
          subPath: pdns.conf
        env:
          - name: PDNS_launch
            value: "gpgsql"
          - name: PDNS_gpgsql_host
            valueFrom: { secretKeyRef: { name: pdns-db-secrets, key: int_host } }
          - name: PDNS_gpgsql_dbname
            valueFrom: { secretKeyRef: { name: pdns-db-secrets, key: int_db } }
          - name: PDNS_gpgsql_user
            valueFrom: { secretKeyRef: { name: pdns-db-secrets, key: int_user } }
          - name: PDNS_gpgsql_password
            valueFrom: { secretKeyRef: { name: pdns-db-secrets, key: int_pw } }
          - name: PDNS_api
            value: "yes"
          - name: PDNS_api_key
            valueFrom: { secretKeyRef: { name: pdns-db-secrets, key: api_key } }
          - name: PDNS_webserver
            value: "yes"
          - name: PDNS_webserver_port
            value: "8081"
          - name: PDNS_webserver_address
            value: "0.0.0.0"
      volumes:
      - name: config-volume
        configMap:
          name: pdns-internal-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns-admin-internal
  namespace: powerdns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdns-admin-internal
  template:
    metadata:
      labels:
        app: pdns-admin-internal
    spec:
      nodeSelector:
        dns-type: "internal"
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "powerdns"
        effect: "NoSchedule"
      containers:
      - name: pdns-admin
        image: powerdnsadmin/pda-legacy:latest
        env:
         - name: SQLALCHEMY_DATABASE_URI
           value: "postgresql://pdns_internal_user:YOUR_SECURE_INTERNAL_DB_PASSWORD@db-cluster-isolated.internal:5434/pdns_internal_prod"
         - name: GUNICORN_TIMEOUT
           value: "60"
---
apiVersion: v1
kind: Service
metadata:
  name: pdns-internal-svc
  namespace: powerdns
spec:
  selector:
    app: pdns-auth-internal
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
    - name: api
      protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: pdns-admin-internal-service
  namespace: powerdns
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: pdns-admin-internal
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdns-admin-ingress
  namespace: powerdns
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ns-1.example.edu.kz
    - ns-2.example.edu.kz
    - ns-3.example.edu.kz
    - ns-4.example.edu.kz
    secretName: pdns-wildcard-tls-cert
  rules:
  # Маршрутизация на ВНЕШНЮЮ веб-админку (сервера ns-1, ns-2, ns-3)
  - host: ns-1.example.edu.kz
    http: &external_rules
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pdns-admin-external-service
            port:
              number: 80
  - host: ns-2.example.edu.kz
    http: *external_rules
  - host: ns-3.example.edu.kz
    http: *external_rules
  
  # Маршрутизация на ВНУТРЕННЮЮ веб-админку (выделенный сервер ns-4)
  - host: ns-4.example.edu.kz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pdns-admin-internal-service
            port:
              number: 80