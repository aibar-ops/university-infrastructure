apiVersion: v1
kind: Secret
metadata:
  name: pdns-db-secrets
  namespace: powerdns
type: Opaque
stringData:
  # Настройки подключения к внешнему DNS-контуру (СУБД PostgreSQL)
  ext_host: "db-cluster-isolated.internal"
  ext_port: "5433"
  ext_db: "pdns_external_prod"
  ext_user: "pdns_external_user"
  ext_pw: "YOUR_SECURE_EXTERNAL_DB_PASSWORD"

  # Настройки подключения к внутреннему DNS-контуру (СУБД PostgreSQL)
  int_host: "db-cluster-isolated.internal"
  int_port: "5434"
  int_db: "pdns_internal_prod"
  int_user: "pdns_internal_user"
  int_pw: "YOUR_SECURE_INTERNAL_DB_PASSWORD"

  # Глобальный API-ключ для интеграции PowerDNS Admin с серверами авторизации
  api_key: "YOUR_GENERATED_STRONG_API_KEY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-internal-config
  namespace: powerdns
data:
  pdns.conf: |
    launch=gpgsql
    gpgsql-host=db-cluster-isolated.internal
    gpgsql-port=5434
    gpgsql-dbname=pdns_internal_prod
    gpgsql-user=pdns_internal_user
    gpgsql-password=YOUR_SECURE_INTERNAL_DB_PASSWORD
    api=yes
    api-key=YOUR_GENERATED_STRONG_API_KEY
    webserver=yes
    webserver-address=0.0.0.0
    webserver-port=8081
    webserver-allow-from=0.0.0.0/0